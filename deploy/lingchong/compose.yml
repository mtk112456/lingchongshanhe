name: lingchong

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/lingchong/Dockerfile.api
    image: lingchong-api:local
    restart: unless-stopped
    env_file:
      - ${TEACHING_ENV_FILE:-/opt/home-lab/server-deploy/stacks/teaching-app/.env}
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      SLICE_CONFIG: /var/www/html/config.docker.php
      # 切片测试期允许教师提前锁令；正式版改为 0，由 cron 在截止时锁定。
      ALLOW_FORCE_LOCK: "1"
    volumes:
      - ./logs:/var/www/html/logs
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - teaching

  cron:
    image: lingchong-api:local
    restart: unless-stopped
    env_file:
      - ${TEACHING_ENV_FILE:-/opt/home-lab/server-deploy/stacks/teaching-app/.env}
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      SLICE_CONFIG: /var/www/html/config.docker.php
    command:
      - sh
      - -c
      - "while true; do php /var/www/html/scripts/cron.php; sleep 60; done"
    depends_on:
      - api
    networks:
      - teaching

networks:
  teaching:
    external: true
    name: teaching-app_default
