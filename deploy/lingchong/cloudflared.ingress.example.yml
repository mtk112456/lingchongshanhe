# 合并到现有 Cloudflare Tunnel 的 ingress 列表，不要整体替换原有配置。
# 先在 Cloudflare Zero Trust → Networks → Tunnels → Public Hostname 添加：
#   game.yourdomain.com  →  http://localhost:8090
# 若使用本地 config.yml，可参考：
ingress:
  - hostname: game.yourdomain.com
    service: http://localhost:8090

  # 可选：实时房间服务（WebSocket）时再加
  # - hostname: rt.yourdomain.com
  #   service: http://localhost:8091

  - service: http_status:404
